version: '3'

services:
    postgres:
        image: postgres:17
        container_name: finance-app
        environment:
            POSTGRES_PASSWORD: root
            POSTGRES_USER: root
            POSTGRES_DB: finance-app
        ports:
            - '5432:5432'
        volumes:
            - ./.postgres-data:/var/lib/postgresql/data

    postgres-test:
        image: postgres:17
        container_name: finance-app-test
        environment:
            POSTGRES_PASSWORD: root
            POSTGRES_USER: root
            POSTGRES_DB: finance-app
        ports:
            - '5433:5432'
